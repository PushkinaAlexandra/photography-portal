<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH Explorer — Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #d4c9b8;
            border-bottom: 2px solid #d4c9b8;
            padding-bottom: 10px;
        }
        .subtitle {
            color: #b0a392;
            margin-bottom: 20px;
        }
        .map-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            height: 600px;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* --- Customize Leaflet attribution --- */
        .leaflet-control-attribution {
            background: rgba(26, 26, 26, 0.8) !important;
            color: #666 !important;
            font-size: 11px !important;
            padding: 2px 10px !important;
            border-radius: 4px !important;
            border: 1px solid rgba(212, 201, 184, 0.1) !important;
            bottom: 10px !important;
            right: 10px !important;
        }
        .leaflet-control-attribution a {
            color: #888 !important;
            text-decoration: none !important;
            transition: color 0.3s ease !important;
        }
        .leaflet-control-attribution a:hover {
            color: #d4c9b8 !important;
            text-decoration: underline !important;
        }

        /* --- Custom zoom controls style --- */
        .leaflet-control-zoom {
            border: 1px solid rgba(212, 201, 184, 0.15) !important;
            border-radius: 6px !important;
            overflow: hidden !important;
        }
        .leaflet-control-zoom a {
            background: rgba(26, 26, 26, 0.85) !important;
            color: #b0a392 !important;
            border-color: rgba(212, 201, 184, 0.1) !important;
            transition: background 0.3s ease !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(212, 201, 184, 0.2) !important;
            color: #d4c9b8 !important;
        }
        .leaflet-control-zoom a:first-child {
            border-bottom: 1px solid rgba(212, 201, 184, 0.1) !important;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d4c9b8;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #f0e6d4;
            text-decoration: underline;
        }

        /* --- Leaflet popup styling --- */
        .leaflet-popup-content-wrapper {
            background: #2a2a2a !important;
            color: #e0e0e0 !important;
            border-radius: 8px !important;
            border: 1px solid rgba(212, 201, 184, 0.15) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
        }
        .leaflet-popup-tip {
            background: #2a2a2a !important;
            border: 1px solid rgba(212, 201, 184, 0.15) !important;
        }
        .leaflet-popup-content {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            font-size: 14px !important;
            color: #e0e0e0 !important;
            padding: 8px 12px !important;
        }
        .leaflet-popup-content strong {
            color: #d4c9b8 !important;
            font-size: 16px !important;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌍 Where photographers were born</h1>
    <p class="subtitle">Click on a country to see how many photographers were born there</p>
    <div class="map-container">
        <div id="map"></div>
    </div>
    <a href="dh-explorer.html" class="back-link">← Back to Explorer</a>
</div>
<script src="../js/dh-map.js"></script>
</body>
</html>
