<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH Explorer — Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #d4c9b8;
            border-bottom: 2px solid #d4c9b8;
            padding-bottom: 10px;
        }
        .map-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            height: 600px;
        }
        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d4c9b8;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌍 Where photographers were born</h1>
    <p>Click on a country to see photographers from there.</p>
    <div class="map-container">
        <div id="map"></div>
    </div>
    <a href="dh-explorer.html" class="back-link">← Back to Explorer</a>
</div>
<script src="../js/dh-map.js"></script>
</body>
</html>
