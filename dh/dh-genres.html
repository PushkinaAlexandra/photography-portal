<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH Explorer — Genres</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #d4c9b8;
            border-bottom: 2px solid #d4c9b8;
            padding-bottom: 10px;
        }
        .subtitle {
            color: #b0a392;
            margin-bottom: 20px;
        }

        /* --- Filter bar --- */
        .filter-bar {
            background: #2a2a2a;
            padding: 15px 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filter-bar label {
            color: #b0a392;
            font-size: 14px;
            font-weight: bold;
        }
        .filter-bar select {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid rgba(212, 201, 184, 0.2);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .filter-bar select:hover {
            border-color: #d4c9b8;
        }
        .filter-bar select:focus {
            border-color: #d4c9b8;
            box-shadow: 0 0 0 2px rgba(212, 201, 184, 0.1);
        }
        .filter-bar .filter-info {
            color: #666;
            font-size: 13px;
            margin-left: auto;
        }

        .chart-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            margin-top: 20px;
            height: 500px;
            position: relative;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d4c9b8;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #f0e6d4;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Genres Distribution</h1>
    <p class="subtitle" id="filterSubtitle">Hover over a bar to see which photographers worked in each genre</p>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <label for="centurySelect">📅 Filter by century:</label>
        <select id="centurySelect"></select>
        <span class="filter-info" id="filterInfo">All photographers</span>
    </div>

    <div class="chart-container">
        <canvas id="genreChart"></canvas>
    </div>
    <a href="dh-explorer.html" class="back-link">← Back to Explorer</a>
</div>
<script src="../js/dh-genres.js"></script>
</body>
</html>
