<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH Explorer — Genres</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #d4c9b8;
            border-bottom: 2px solid #d4c9b8;
            padding-bottom: 10px;
        }
        .chart-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d4c9b8;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Genres Distribution</h1>
    <p>How many photographers worked in each genre.</p>
    <div class="chart-container">
        <canvas id="genreChart"></canvas>
    </div>
    <a href="dh-explorer.html" class="back-link">← Back to Explorer</a>
</div>
<script src="../js/dh-genres.js"></script>
</body>
</html>
